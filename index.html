<link rel="manifest" href='data:application/manifest+json,{"name":"Hestrel","short_name":"Hestrel","start_url":".","display":"standalone","background_color":"%230a0e14","theme_color":"%230a0e14","description":"Field estimates with a signed witness. Every Estimate Has a Witness."}'>
<title>Hestrel — Every Estimate Has a Witness.</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0d1320; --panel:#121a29; --panel2:#182338; --line:#22334f;
    --text:#e9eff8; --muted:#93a4bd; --faint:#647691;
    --accent:#33a1ff; --accent2:#7cc4ff; --accent-dim:rgba(51,161,255,.14);
    --good:#2fbf71; --warn:#ffb020; --bad:#ff5d5d;
    --radius:14px;
  }
  html{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4{margin:0 0 .4em; line-height:1.2}
  p{margin:0 0 .7em}
  a{color:var(--accent2)}
  button{font:inherit; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--text)}
  .hidden{display:none !important}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 16px; background:rgba(10,14,20,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .brand svg{flex:0 0 auto}
  .brand img{flex:0 0 auto; border-radius:9px; display:block}
  .brand-name{font-size:21px; font-weight:800; letter-spacing:.14em}
  .brand-name span{color:var(--accent)}
  .brand-tag{font-size:11.5px; color:var(--muted); letter-spacing:.04em; white-space:nowrap}
  .topnav{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
  .navbtn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:9px 15px; border-radius:999px; font-weight:600; font-size:14.5px;
  }
  .navbtn.primary{background:var(--accent); border-color:var(--accent); color:#04121f}
  .navbtn:active{transform:translateY(1px)}

  main{max-width:880px; margin:0 auto; padding:18px 14px 90px}
  .banner{
    max-width:880px; margin:12px auto 0; padding:11px 14px; border-radius:10px;
    background:rgba(255,93,93,.13); border:1px solid var(--bad); color:#ffc9c9; font-size:14.5px;
  }

  /* ---------- generic panels & forms ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .panel h2{font-size:19px}
  .panel h3{font-size:16px; color:var(--accent2)}
  .subtle{color:var(--muted); font-size:14px}
  .tiny{color:var(--faint); font-size:12.5px}
  label.field{display:block; margin-bottom:13px}
  label.field > span{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:.02em}
  .input, input[type="text"].input, input[type="number"].input, input[type="tel"].input,
  input[type="email"].input, input[type="url"].input, input[type="date"].input, textarea.input, select.input{
    width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; outline:none;
  }
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim)}
  textarea.input{min-height:84px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr} }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:12px 18px; border-radius:12px; font-weight:700; font-size:15.5px; text-decoration:none;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#04121f}
  .btn.good{background:var(--good); border-color:var(--good); color:#04150b}
  .btn.danger{background:transparent; border-color:var(--bad); color:#ff9c9c}
  .btn.small{padding:8px 13px; font-size:14px; border-radius:10px}
  .btn:disabled{opacity:.42; cursor:not-allowed}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btnrow .spacer{flex:1}
  .checkline{display:flex; gap:10px; align-items:flex-start; margin:10px 0}
  .checkline input{width:20px; height:20px; margin-top:2px; accent-color:var(--accent)}

  /* ---------- job list ---------- */
  .jobcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 17px; margin-bottom:11px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .jobcard .jc-main{flex:1 1 220px; min-width:0}
  .jobcard .jc-num{font-weight:800; letter-spacing:.03em}
  .jobcard .jc-cust{color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .jobcard .jc-total{font-weight:800; font-size:17px}
  .chip{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
    border:1px solid var(--line); color:var(--muted); letter-spacing:.02em;
  }
  .chip.blue{color:var(--accent2); border-color:var(--accent)}
  .chip.green{color:#7fe6ae; border-color:var(--good)}
  .chip.amber{color:#ffd27c; border-color:var(--warn)}
  .empty{
    text-align:center; padding:38px 18px; color:var(--muted);
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* ---------- steps ---------- */
  .steps{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .stepbtn{
    flex:1 1 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:11px; padding:10px 6px; font-size:13.5px; font-weight:700; text-align:center;
  }
  .stepbtn .n{
    display:inline-flex; width:21px; height:21px; border-radius:50%; margin-right:6px;
    background:var(--panel2); border:1px solid var(--line); align-items:center; justify-content:center; font-size:12px;
  }
  .stepbtn.active{color:var(--text); border-color:var(--accent); background:var(--accent-dim)}
  .stepbtn.active .n{background:var(--accent); color:#04121f; border-color:var(--accent)}
  .stepbtn.done{color:#7fe6ae}
  .stepbtn.done .n{background:var(--good); color:#04150b; border-color:var(--good)}
  .stepbtn.locked{opacity:.45}

  /* ---------- signature pad ---------- */
  .consent-text{
    background:var(--bg2); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:10px; padding:13px 15px; font-size:15px; margin-bottom:14px;
  }
  .sigwrap{background:#fff; border-radius:12px; padding:8px; position:relative}
  .sigwrap canvas{display:block; width:100%; height:190px; touch-action:none; border-radius:6px}
  .sigwrap .sigline{
    position:absolute; left:26px; right:26px; bottom:34px; border-bottom:2px solid #b9c4d4; pointer-events:none;
  }
  .sigwrap .sigx{
    position:absolute; left:26px; bottom:38px; color:#8fa0b5; font-size:19px; pointer-events:none;
  }
  .sig-saved{background:#fff; border-radius:12px; padding:10px; text-align:center}
  .sig-saved img{max-width:100%; height:110px; object-fit:contain}

  /* ---------- catalog & line items ---------- */
  .catgroup{margin-bottom:8px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .catgroup > button.cathead{
    width:100%; text-align:left; background:var(--panel2); color:var(--text); border:0;
    padding:13px 15px; font-weight:700; font-size:15.5px; display:flex; justify-content:space-between; align-items:center;
  }
  .catitems{background:var(--bg2)}
  .catrow{
    display:flex; align-items:center; gap:10px; padding:10px 15px; border-top:1px solid var(--line);
  }
  .catrow .cl{flex:1; min-width:0}
  .catrow .cl .u{color:var(--faint); font-size:12.5px}
  .catrow .cp{font-weight:700; white-space:nowrap}
  .catrow .cp.noprice{color:var(--warn); font-weight:600; font-size:13px}
  table.items{width:100%; border-collapse:collapse; margin-top:6px}
  table.items th{
    text-align:left; font-size:12px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase;
    padding:6px 6px; border-bottom:1px solid var(--line);
  }
  table.items td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.items input{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px 9px; width:100%}
  table.items input.qty{max-width:74px}
  table.items input.price{max-width:110px}
  table.items .lt{text-align:right; font-weight:700; white-space:nowrap}
  table.items th.r, table.items td.r{text-align:right}
  .iconbtn{
    background:transparent; border:1px solid var(--line); color:#ff9c9c; border-radius:8px;
    width:36px; height:36px; font-size:16px; line-height:1;
  }
  .totals{margin-top:14px; border-top:2px solid var(--line); padding-top:12px}
  .totals .trow{display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:15.5px}
  .totals .trow.grand{font-size:20px; font-weight:800; border-top:1px solid var(--line); margin-top:8px; padding-top:10px}
  .totals .taxin{display:flex; align-items:center; gap:6px}
  .totals .taxin input{width:76px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:6px 8px}

  /* ---------- price setup ---------- */
  .pricerow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
  .pricerow .pl{flex:1; min-width:0; font-size:14.5px}
  .pricerow .pl .u{color:var(--faint); font-size:12px}
  .pricerow input{width:118px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px 9px}

  .thumb{max-width:180px; border-radius:10px; border:1px solid var(--line); display:block; margin-top:8px}
  .dictation-off{
    border:1px dashed var(--line); border-radius:12px; padding:13px 15px; color:var(--muted); font-size:14.5px;
    background:rgba(51,161,255,.05);
  }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); color:var(--text); border:1px solid var(--accent); border-radius:999px;
    padding:10px 20px; font-weight:600; font-size:14.5px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:99; max-width:92vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ---------- printable document (packet / invoice) ---------- */
  #print-area{display:none}
  @media print{
    body{background:#fff}
    .topbar, main, #toast, .banner{display:none !important}
    #print-area{display:block !important}
    .doc{padding:6px 4px}
    @page{margin:14mm}
  }
</style>
</head>

/* ---------- shell-pack catalog (HVAC) — prices null by design ---------- */
const CATALOG = {"categories":[{"id":"diagnostics","items":[{"id":"diag-fee","label":"Diagnostic / service call fee","price":null,"unit":"flat"},{"id":"after-hours","label":"After-hours / emergency fee","price":null,"unit":"flat"},{"id":"second-system-diag","label":"Second system diagnostic","price":null,"unit":"flat"}],"label":"Diagnostics & Fees"},{"id":"heating-repairs","items":[{"id":"igniter","label":"Hot surface igniter replacement","price":null,"unit":"flat"},{"id":"flame-sensor","label":"Flame sensor clean / replace","price":null,"unit":"flat"},{"id":"inducer-motor","label":"Inducer motor replacement","price":null,"unit":"flat"},{"id":"gas-valve","label":"Gas valve replacement","price":null,"unit":"flat"},{"id":"control-board","label":"Control board replacement","price":null,"unit":"flat"},{"id":"pressure-switch","label":"Pressure switch replacement","price":null,"unit":"flat"},{"id":"heat-exchanger-inspection","label":"Heat exchanger inspection","price":null,"unit":"flat"}],"label":"Heating Repairs","seasonalPriority":"heat"},{"id":"airflow-motors","items":[{"id":"blower-motor","label":"Blower motor replacement","price":null,"unit":"flat"},{"id":"ecm-module","label":"ECM module replacement","price":null,"unit":"flat"},{"id":"condenser-fan-motor","label":"Condenser fan motor replacement","price":null,"unit":"flat"},{"id":"duct-cleaning","label":"Duct cleaning","price":null,"unit":"per-vent"}],"label":"Motors & Airflow"},{"id":"cooling-repairs","items":[{"id":"capacitor","label":"Capacitor replacement","price":null,"unit":"flat"},{"id":"contactor","label":"Contactor replacement","price":null,"unit":"flat"},{"id":"refrigerant-r410a","label":"Refrigerant recharge R-410A","price":null,"unit":"per-lb"},{"id":"refrigerant-r22","label":"Refrigerant recharge R-22","price":null,"unit":"per-lb"},{"id":"refrigerant-r32","label":"Refrigerant recharge R-32 / R-454B","price":null,"unit":"per-lb"},{"id":"leak-search","label":"Leak search (electronic)","price":null,"unit":" nly. Prices are null on purpose: each customer fills their own during the $299 setup. Items marked seasonalPriority 'heat' surface first in winter config, 'cool' first in summer.","pack":"hvac","packetBlocks":{"consentPage":true,"goodBetterBest":true,"maintenancePlanOffer":true,"permitNote":true,"repairVsReplace":true,"systemAgeNote":true,"warrantyFields":["partsWarranty","laborWarranty"]},"version":"0.1-draft"};

/* =====================================================================
   CORE — storage, settings, money, job model.
   These functions are deliberately DOM-free so the whole flow
   (setup -> estimate -> consent -> approval -> invoice) can be
   exercised and tested headlessly. The UI layer below calls them.
   ===================================================================== */
const LS_KEYS = {
  settings: "hestrel.settings.v1",
  prices:   "hestrel.prices.v1",
  jobs:     "hestrel.jobs.v1"
};

let storageFault = null; // set to a message string when a save fails
function lsLoad(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    const v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}
function lsSave(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    if (storageFault) { storageFault = null; if (typeof onStorageRecovered === "function") onStorageRecovered(); }
    return true;
  } catch (e) {
    storageFault = "Saving failed on this device (storage may be full). What you see on screen is NOT saved yet — free up space or export the packet before closing.";
    if (typeof onStorageError === "function") onStorageError(storageFault);
    return false;
  }
}

/* ---------- money: integer cents everywhere ---------- */
function toCents(dollars) {
  if (dollars === null || dollars === undefined || dollars === "") return 0;
  const n = Number(dollars);
  return isFinite(n) ? Math.round(n * 100) : 0;
}
function fmtMoney(cents) {
  const n = (Number(cents) || 0) / 100;
  return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
}
function fmtDateTime(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }); }
  catch (e) { return String(ts); }
}
function fmtDate(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleDateString("en-US", { dateStyle: "medium" }); }
  catch (e) { return String(ts); }
}
function uid(prefix) {
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- settings (business setup) ---------- */
const DEFAULT_SETTINGS = {
  businessName: "",
  logoText: "",
  phone: "",
  email: "",
  address: "",
  taxRate: 0,               // percent, e.g. 7.5
  terms: "This estimate is valid for 30 days from the date above. Work is performed as described in the line items; any additional work found necessary will be quoted and approved before it is done. Payment is due on completion unless other terms are agreed in writing.",
  paymentLink: "",          // the BUSINESS'S OWN payment link — never Toastid's
  paymentNote: "Payments go directly to the business through its own payment provider. Hestrel / Toastid Tech never handles or holds these funds.",
  partsWarrantyDefault: "",
  laborWarrantyDefault: "",
  permitNoteDefault: "Permits and inspections, where required, are included as a line item or arranged by the business before work begins.",
  maintenanceOfferDefault: "Ask us about our annual maintenance plan — two tune-ups a year and priority scheduling.",
  includeConsentPage: true,
  estCounter: 1000,
  invCounter: 1000
};
function loadSettings() {
  const s = lsLoad(LS_KEYS.settings, {});
  return Object.assign({}, DEFAULT_SETTINGS, s || {});
}
function saveSettings(s) { return lsSave(LS_KEYS.settings, s); }

/* ---------- price book: catalog ships price-null; the business fills
   their own prices in Setup. Stored separately from the pack so a pack
   refresh never wipes a customer's pricing. ---------- */
function loadPrices() { return lsLoad(LS_KEYS.prices, {}) || {}; }
function savePrices(p) { return lsSave(LS_KEYS.prices, p); }
function catalogItemById(id) {
  for (const cat of (CATALOG.categories || [])) {
    for (const it of (cat.items || [])) if (it.id === id) return it;
  }
  return null;
}
function effectivePriceCents(itemId, priceBook) {
  const pb = priceBook || loadPrices();
  if (pb[itemId] !== undefined && pb[itemId] !== null && pb[itemId] !== "") return toCents(pb[itemId]);
  const item = catalogItemById(itemId);
  if (item && item.price !== null && item.price !== undefined) return toCents(item.price);
  return null; // no price set anywhere — builder must ask
}

/* Seasonal sort: heating surfaces first Oct–Mar, cooling first Apr–Sep. */
function currentSeason() {
  const m = new Date().getMonth(); // 0=Jan
  return (m >= 9 || m <= 2) ? "heat" : "cool";
}
function categorySeason(cat) {
  if (cat.seasonalPriority) return cat.seasonalPriority;
  let heat = 0, cool = 0;
  for (const it of (cat.items || [])) {
    if (it.seasonalPriority === "heat") heat++;
    if (it.seasonalPriority === "cool") cool++;
  }
  if (heat > cool) return "heat";
  if (cool > heat) return "cool";
  return null;
}
function sortedCategories(season) {
  const s = season || currentSeason();
  const cats = (CATALOG.categories || []).slice();
  return cats.sort((a, b) => {
    const pa = categorySeason(a) === s ? 0 : 1;
    const pb = categorySeason(b) === s ? 0 : 1;
    return pa - pb;
  });
}

/* ---------- jobs ---------- */
function loadJobs() { return lsLoad(LS_KEYS.jobs, []) || []; }
function saveJobs(jobs) { return lsSave(LS_KEYS.jobs, jobs); }
function findJob(jobs, id) { return jobs.find(j => j.id === id) || null; }

function newJob(settings) {
  const s = settings || loadSettings();
  const now = Date.now();
  return {
    id: uid("job"),

}
function persistNewJob(jobs, job, settings) {
  // settings counter was bumped in newJob(); persist both, disk-first.
  saveSettings(settings);
  jobs.unshift(job);

  return job;
}
function touchJob(jobs, job) {
  job.updatedAt = Date.now();

}

/* ---------- line items & totals ---------- */
function addCatalogItem(job, itemId, priceBook) {
  const item = catalogItemById(itemId);
  if (!item) return null;
  const priceCents = effectivePriceCents(itemId, priceBook);
  const line = {
    id: uid("ln"),
    catalogId: itemId,
    label: item.label,
    unit: item.unit || "flat",
    qty: 1,
    priceCents: priceCents === null ? 0 : priceCents,
    priceUnset: priceCents === null
  };
  job.items.push(line);
  return line;
}
function addCustomItem(job, label) {
  const line = { id: uid("ln"), catalogId: null, label: label || "Custom item", unit: "flat", qty: 1, priceCents: 0, priceUnset: false };
  job.items.push(line);
  return line;
}
function removeItem(job, lineId) {
  job.items = job.items.filter(l => l.id !== lineId);
}
function lineTotalCents(line) {
  const q = Number(line.qty);
  return Math.round((isFinite(q) ? q : 0) * (Number(line.priceCents) || 0));
}
function computeTotals(job) {
  let subtotal = 0;
  for (const l of (job.items || [])) subtotal += lineTotalCents(l);
  const rate = Number(job.taxRate) || 0;
  const tax = Math.round(subtotal * rate / 100);
  return { subtotalCents: subtotal, taxCents: tax, totalCents: subtotal + tax, taxRate: rate };
}

/* ---------- consent & approval (the two signature moments, distinct) -- */
const CONSENT_SENTENCE = "You agreed to be recorded, to have the conversation transcribed and summarized by AI, and to have it stored by the business named above together with this estimate.";
function consentResolved(job) {
  return job.consent && (job.consent.status === "signed" || job.consent.status === "declined");
}
function signConsent(job, signerName, signatureData, place) {
  job.consent = {
    status: "signed",
    signerName: String(signerName || "").trim(),
    signatureData: signatureData || null,
    signedAt: Date.now(),
    place: place || job.serviceAddress || job.customer.address || "",
    covered: "the on-site conversation for this visit"
  };
  if (job.status === "draft") job.status = "in-progress";
  return job.consent;
}
function declineConsent(job) {
  // Graceful refusal path: written-notes mode, no recording. Never pressure.
  job.consent = {
    status: "declined",
    signerName: "", signatureData: null, signedAt: Date.now(),
    place: job.serviceAddress || job.customer.address || "",
    covered: "the on-site conversation for this visit"
  };
  if (job.status === "draft") job.status = "in-progress";
  return job.consent;
}
function signApproval(job, signerName, signatureData) {
  job.approval = {
    status: "signed",
    signerName: String(signerName || "").trim(),
    signatureData: signatureData || null,
    signedAt: Date.now()
  };
  job.status = "approved";
  return job.approval;
}

/* ---------- invoice conversion: carries the business's OWN link ------ */
function convertToInvoice(job, settings) {
  if (!job.approval || job.approval.status !== "signed") {
    return { ok: false, error: "The estimate must be approved and signed before it can become an invoice." };
  }
  if (job.invoice) return { ok: true, invoice: job.invoice, already: true };
  const s = settings || loadSettings();
  const totals = computeTotals(job);
  job.invoice = {
    number: "INV-" + (++s.invCounter),
    issuedAt: Date.now(),
    dueDate: Date.now() + 14 * 24 * 60 * 60 * 1000,
    status: "unpaid",
    totalCents: totals.totalCents,
    paymentLink: s.paymentLink || "",       // snapshot of the business's own link
    paymentNote: s.paymentNote || "",
    estimateNumber: job.number
  };
  saveSettings(s);
  job.status = "invoiced";
  return { ok: true, invoice: job.invoice };
}
function jobStatusLabel(job) {
  if (job.invoice) return job.invoice.status === "paid" ? "Closed" : "Invoiced";
  if (job.approval && job.approval.status === "signed") return "Approved";
  if (job.consent && job.consent.status === "signed") return "Consent signed";
  if (job.consent && job.consent.status === "declined") return "Notes mode";
  return "Draft";
}

function downscaleImage(file, maxPx, cb) {
  // Performance rule: shrink at capture, never hold the full-size image.
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(cv.toDataURL("image/jpeg", 0.78), null);
      } catch (err) { cb(null, err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); cb(null, new Error("image load failed")); };
    img.src = url;
  } catch (err) { cb(null, err); }
}

/* ----- signature pad (canvas, pointer events, disk-first on save) ----- */
function makePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false, dirty = false, last = null;
  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const prev = dirty ? canvas.toDataURL() : null;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#12233c";
    if (prev) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = prev; }
  }
  function pos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", (ev) => {
    drawing = true; last = pos(ev);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!drawing) return;
    const p = pos(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; dirty = true;
    ev.preventDefault();
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
  return {
    fit,
    isEmpty: () => !dirty,
    clear: () => { const r = canvas.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); dirty = false; },
    dataURL: () => canvas.toDataURL("image/png")
  };
}

/* ----- Step 2: consent signature (the witness) ----- */
function consentTextHtml(job) {
  const biz = esc(settings.businessName || "This business");
  return "<p><strong>Before we start — your permission to record.</strong></p>" +
    "<p>" + biz + " would like to record our conversation during this visit so nothing about your system or this job gets missed or misremembered. The recording will be turned into text and a summary by AI tools, and stored by " + biz + " together with your estimate.</p>" +
    "<p>You can tell us to stop recording at any time, and stopping will be noted on the record. Signing below says you're OK with all of that.</p>" +
    "<p>If you'd rather not be recorded, just say so — we'll take written notes instead. No pressure either way, and the estimate is the same.</p>";
}
function renderStepConsent(job, body) {
  const cn = job.consent;
  let inner = '<div class="panel"><h3>Consent to record — sign before anything is recorded</h3>' +
    '<div class="consent-text">' + consentTextHtml(job) + "</div>";
  if (cn.status === "signed") {
    inner += '<div class="sig-saved"><img src="' + cn.signatureData + '" alt="Consent signature"></div>' +
      '<p class="subtle" style="margin-top:10px">Signed by <strong>' + esc(cn.signerName) + "</strong> · " +
      esc(fmtDateTime(cn.signedAt)) + (cn.place ? " · at " + esc(cn.place) : "") + "</p>" +
      '<p class="tiny">This signature is saved with the job and prints as the closing page of the packet — the witness page.</p>' +
      '<div class="btnrow"><button class="btn danger" id="cn-redo" type="button">Clear &amp; re-sign</button></div>';
  } else if (cn.status === "declined") {
    inner += '<div class="consent-text" style="border-left-color:var(--warn)"><p><strong>Written-notes mode.</strong> The customer chose not to be recorded (' +
      esc(fmtDateTime(cn.signedAt)) + "). No recording will be made for this job — take written notes instead. This choice is noted on the packet.</p></div>" +
      '<div class="btnrow"><button class="btn" id="cn-undo" type="button">Customer changed their mind — sign instead</button></div>';
  } else {
    inner += fld("Signer's printed name", '<input class="input" id="cn-name" value="' + esc(cn.signerName || job.customer.name || "") + '" autocomplete="name">') +
      '<div class="sigwrap"><canvas id="cn-pad"></canvas><div class="sigline"></div><div class="sigx">✕</div></div>' +
      '<div class="btnrow"><button class="btn" id="cn-clear" type="button">Clear</button>' +
      '<button class="btn primary" id="cn-sign" type="button">Sign &amp; save consent</button></div>' +
      '<div class="btnrow"><button class="btn" id="cn-decline" type="button">Customer prefers written notes (no recording)</button></div>' +
      '<p class="tiny">The signature is written to this device the moment it is saved — a crash or dead battery cannot lose it.</p>';
  }
  inner += "</div>" + stepNav(job, 0, 2, "To estimate");
  body.innerHTML = inner;

  if (cn.status === "pending") {
    const pad = makePad(body.querySelector("#cn-pad"));
    requestAnimationFrame(() => pad.fit());
    body.querySelector("#cn-clear").addEventListener("click", () => pad.clear());
    body.querySelector("#cn-sign").addEventListener("click", () => {
      const name = body.querySelector("#cn-name").value.trim();
      if (!name) { toast("Add the signer's printed name first"); return; }
      if (pad.isEmpty()) { toast("The signature box is empty — sign above the line"); return; }
      signConsent(job, name, pad.dataURL());
      persist(job);
      toast("Consent signed & saved");
      renderJob();
    });
    body.querySelector("#cn-decline").addEventListener("click", () => {
      declineConsent(job);
      persist(job);
      toast("Written-notes mode set — no recording for this job");
      renderJob();
    });
  }
  const redo = body.querySelector("#cn-redo");
  if (redo) redo.addEventListener("click", () => {
    if (!confirm("Clear the saved consent signature and sign again?")) return;
    job.consent = { status: "pending", signerName: cn.signerName, signatureData: null, signedAt: null, place: "", covered: cn.covered };
    persist(job); renderJob();
  });
  const undo = body.querySelector("#cn-undo");
  if (undo) undo.addEventListener("click", () => {
    job.consent = { status: "pending", signerName: "", signatureData: null, signedAt: null, place: "", covered: cn.covered };
    persist(job); renderJob();
  });
  bindNav(job, body);
}

/* ----- Step 3: estimate builder ----- */
function renderStepEstimate(job, body) {

  for (const cat of cats) {
    const cs = categorySeason(cat);

    for (const it of (cat.items || [])) {
      const pc = effectivePriceCents(it.id, priceBook);
      rows += '<div class="catrow"><div class="cl">' + esc(it.label) + '<div class="u">per ' + esc(it.unit || "flat") + "</div></div>" +
        (pc === null ? '<span class="cp noprice">no price set</span>' : '<span class="cp">' + esc(fmtMoney(pc)) + "</span>") +
        '<button class="btn small primary" type="button" data-add="' + esc(it.id) + '">Add</button></div>';
    }

    '<div class="btnrow"><button class="btn" id="es-custom" type="button">+ Custom line item</button></div></div>' +
    '<div class="panel"><h3>Line items</h3><div id="es-items"></div><div id="es-totals"></div></div>' +
    '<div class="panel"><h3>Visit notes</h3>' +
    '<div class="dictation-off">🎙 <strong>Dictation is coming in Step 4.</strong> Soon you\'ll talk the job and Hestrel will structure it into line items using your catalog and the HVAC glossary (' +
      esc((CATALOG.dictationGlossary || []).slice(0, 6).join(", ")) + '…). For now, type notes below — they save as you go.</div>' +
    '<label class="field" style="margin-top:12px"><span>Notes for this job</span><textarea class="input" id="es-notes" placeholder="What you found, what you told the customer…">' + esc(job.notes) + "</textarea></label></div>" +
    stepNav(job, 1, 3, "To approval");
  body.querySelectorAll("[data-cat]").forEach(h => h.addEventListener("click", () => {
    const panel = body.querySelector('[data-catitems="' + h.getAttribute("data-cat") + '"]');
    if (panel) panel.classList.toggle("hidden");
  }));
  body.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const line = addCatalogItem(job, b.getAttribute("data-add"), priceBook);
    if (line) {
      persist(job);
      renderItems(job, body);
      if (line.priceUnset) toast("Added — set its price in the line items (none saved in Setup yet)");
    }
  }));
  body.querySelector("#es-custom").addEventListener("click", () => {
    addCustomItem(job);
    persist(job);
    renderItems(job, body);
  });

  renderItems(job, body);

}
function renderItems(job, body) {
  const wrap = body.querySelector("#es-items");
  const tot = body.querySelector("#es-totals");
  if (!wrap || !tot) return;
  if (!job.items.length) {
    wrap.innerHTML = '<p class="subtle">Nothing yet — add from the catalog above, or add a custom line.</p>';
  } else {
    let rows = "";
    for (const l of job.items) {
      rows += "<tr>" +
        '<td><input data-lf="label" data-lid="' + l.id + '" value="' + esc(l.label) + '">' +
        (l.priceUnset ? '<div class="tiny" style="color:var(--warn)">price was blank in Setup</div>' : "") + "</td>" +
        '<td><input class="qty" data-lf="qty" data-lid="' + l.id + '" type="number" min="0" step="0.5" inputmode="decimal" value="' + esc(l.qty) + '"></td>' +
        '<td><input class="price" data-lf="price" data-lid="' + l.id + '" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc((Number(l.priceCents) / 100).toFixed(2)) + '"></td>' +
        '<td class="lt" data-lt="' + l.id + '">' + esc(fmtMoney(lineTotalCents(l))) + "</td>" +
        '<td><button class="iconbtn" type="button" data-rm="' + l.id + '" aria-label="Remove line">✕</button></td></tr>';
    }
    wrap.innerHTML = '<table class="items"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th class="r">Total</th><th></th></tr></thead><tbody>' + rows + "</tbody></table>";
  }
  const t = computeTotals(job);
  tot.innerHTML = '<div class="totals">' +
    '<div class="trow"><span>Subtotal</span><span id="t-sub">' + esc(fmtMoney(t.subtotalCents)) + "</span></div>" +
    '<div class="trow"><span class="taxin">Tax <input id="t-rate" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(t.taxRate) + '"> %</span><span id="t-tax">' + esc(fmtMoney(t.taxCents)) + "</span></div>" +
    '<div class="trow grand"><span>Total</span><span id="t-grand">' + esc(fmtMoney(t.totalCents)) + "</span></div></div>";
  wrap.querySelectorAll("[data-lf]").forEach(inp => {
    inp.addEventListener("input", () => {
      const line = job.items.find(l => l.id === inp.getAttribute("data-lid"));
      if (!line) return;
      const f = inp.getAttribute("data-lf");
      if (f === "label") line.label = inp.value;
      if (f === "qty") line.qty = inp.value === "" ? 0 : Number(inp.value);
      if (f === "price") { line.priceCents = toCents(inp.value); line.priceUnset = false; }
      persist(job);
      const lt = wrap.querySelector('[data-lt="' + line.id + '"]');
      if (lt) lt.textContent = fmtMoney(lineTotalCents(line));
      const tt = computeTotals(job);
      const s1 = body.querySelector("#t-sub"), s2 = body.querySelector("#t-tax"), s3 = body.querySelector("#t-grand");
      if (s1) s1.textContent = fmtMoney(tt.subtotalCents);
      if (s2) s2.textContent = fmtMoney(tt.taxCents);
      if (s3) s3.textContent = fmtMoney(tt.totalCents);
    });
  });
  wrap.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
    removeItem(job, b.getAttribute("data-rm"));
    persist(job);
    renderItems(job, body);
  }));
  const rateIn = tot.querySelector("#t-rate");
  if (rateIn) rateIn.addEventListener("input", () => {
    job.taxRate = rateIn.value === "" ? 0 : Number(rateIn.value);
    persist(job);
    const tt = computeTotals(job);
    const s2 = body.querySelector("#t-tax"), s3 = body.querySelector("#t-grand");
    if (s2) s2.textContent = fmtMoney(tt.taxCents);
    if (s3) s3.textContent = fmtMoney(tt.totalCents);
  });
}

/* ----- Step 4: estimate approval signature (separate from consent) ---- */
function renderStepApproval(job, body) {
  const ap = job.approval;
  const t = computeTotals(job);
  let inner = '<div class="panel"><h3>Estimate approval</h3>' +
    '<p class="subtle">A different signature from the consent — this one accepts the work and the price.</p>' +
    '<div class="consent-text"><p><strong>Total for this estimate: ' + esc(fmtMoney(t.totalCents)) + '</strong> (' +
    job.items.length + ' line item' + (job.items.length === 1 ? "" : "s") + ", tax included as shown in the packet).</p>" +
    "<p>Signing below says: I approve this estimate — the work described, the price shown, and the terms — and I authorize " +
    esc(settings.businessName || "the business") + " to proceed.</p></div>";
  if (ap.status === "signed") {
    inner += '<div class="sig-saved"><img src="' + ap.signatureData + '" alt="Approval signature"></div>' +
      '<p class="subtle" style="margin-top:10px">Approved by <strong>' + esc(ap.signerName) + "</strong> · " + esc(fmtDateTime(ap.signedAt)) + "</p>" +
      '<div class="btnrow"><button class="btn danger" id="ap-redo" type="button">Clear &amp; re-sign</button>' +
      '<button class="btn good" id="ap-invoice" type="button">Convert to invoice →</button></div>';
  } else {
    if (!job.items.length) inner += '<p class="subtle" style="color:var(--warn)">Heads up: this estimate has no line items yet — go back to Estimate and add some before the customer signs.</p>';
    inner += fld("Approver's printed name", '<input class="input" id="ap-name" value="' + esc(ap.signerName || job.customer.name || "") + '" autocomplete="name">') +
      '<div class="sigwrap"><canvas id="ap-pad"></canvas><div class="sigline"></div><div class="sigx">✕</div></div>' +
      '<div class="btnrow"><button class="btn" id="ap-clear" type="button">Clear</button>' +
      '<button class="btn primary" id="ap-sign" type="button">Sign approval &amp; save</button></div>';
  }
  inner += "</div>" + stepNav(job, 2, 4, "To packet");
  body.innerHTML = inner;

  if (ap.status !== "signed") {
    const pad = makePad(body.querySelector("#ap-pad"));
    requestAnimationFrame(() => pad.fit());
    body.querySelector("#ap-clear").addEventListener("click", () => pad.clear());
    body.querySelector("#ap-sign").addEventListener("click", () => {
      const name = body.querySelector("#ap-name").value.trim();
      if (!name) { toast("Add the approver's printed name first"); return; }
      if (pad.isEmpty()) { toast("The signature box is empty — sign above the line"); return; }
      signApproval(job, name, pad.dataURL());
      persist(job);
      toast("Approval signed & saved");
      renderJob();
    });
  } else {
    body.querySelector("#ap-redo").addEventListener("click", () => {
      if (!confirm("Clear the saved approval signature and sign again?")) return;
      job.approval = { status: "pending", signerName: ap.signerName, signatureData: null, signedAt: null };
      if (job.status === "approved") job.status = "in-progress";
      persist(job); renderJob();
    });
    body.querySelector("#ap-invoice").addEventListener("click", () => { currentStep = 5; renderJob(); });
  }
  bindNav(job, body);
}

   popup below and the in-page previews/print area share one copy. */
const DOC_CSS = `.doc{

font-family:Georgia,"Times New Roman",serif;
}
.doc .d-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #14181f; padding-bottom:12px; margin-bottom:16px}
.doc .d-biz{font-size:23px; font-weight:700; letter-spacing:.02em}
.doc .d-bizsub{font-family:Helvetica,Arial,sans-serif; font-size:12px; color:#444}
.doc .d-title{text-align:right}
.doc .d-title .t{font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:.08em}

.doc h3{

.doc .d-totals .grand{font-size:16.5px; font-weight:700; border-top:2px solid #14181f; margin-top:5px; padding-top:6px}
.doc .d-cols{display:flex; gap:26px; flex-wrap:wrap}
.doc .d-cols > div{flex:1 1 220px}
.doc .d-terms{font-size:12.5px; color:#222; white-space:pre-wrap}
.doc .d-signame{font-family:Helvetica,Arial,sans-serif; font-size:13px; margin-top:4px}

.doc .d-note{background:#f2f5f9; border:1px solid #cfd9e4; border-radius:6px; padding:10px 13px; font-size:13px; margin:10px 0}
.doc .d-watermark{

padding:3px 12px; font-weight:700; letter-spacing:.1em; transform:rotate(-3deg); margin:8px 0;
}
.doc .page-break{page-break-before:always; break-before:page}
.doc .d-foot{

(function injectDocCss() {
  const st = document.createElement("style");
  st.id = "doc-css";
  st.textContent = DOC_CSS;
  document.head.appendChild(st);
})();

function printDoc(html, filename) {
  // Keep the in-page print area filled as a fallback for browsers
  // where window.print() works directly.
  const area = document.getElementById("print-area");
  area.innerHTML = html;
  const doc =
    '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    "<title>Hestrel document</title><style>" + DOC_CSS +
    "\nbody{margin:0;background:#fff}" +
    "\n.printbar{position:sticky;top:0;background:#14181f;padding:10px;text-align:center}" +
    "\n.printbar button{font:600 15px Helvetica,Arial,sans-serif;padding:10px 22px;border:0;border-radius:8px;background:#33a1ff;color:#fff;cursor:pointer}" +
    "\n@media print{.printbar{display:none}}" +
    "\n@page{margin:14mm}" +
    "</style></head><body>" +
    '<div class="printbar"><button type="button" onclick="window.print()">🖨 Print / save as PDF</button></div>' +
    html +
    '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},300);});<\/script>' +
    "</body></html>";
  // Best case: a real browser tab, where print works.
  let w = null;
  try { w = window.open("", "_blank"); } catch (e) { w = null; }
  if (w && w.document) {
    w.document.open();
    w.document.write(doc);
    w.document.close();
    toast("Opened in a new tab — print or save as PDF there");
    return;
  }
  // In-app previews and embedded webviews block popups AND swallow
  // window.print() — the tap used to do nothing at all. Fall back to
  // downloading the document as a file: the user opens it in any
  // browser and prints / saves as PDF from there.
  try {
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || "hestrel-document.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("This viewer blocks print popups — the document downloaded instead. Open the file and print / save as PDF from there.");
  } catch (e) {
    window.print();
  }
}

/* ----- Step 5: packet preview + print ----- */
function renderStepPacket(job, body) {
  body.innerHTML =
    '<div class="panel"><h3>The packet</h3>' +
    '<p class="subtle">Estimate, terms, approval signature' +
    (settings.includeConsentPage ? ", and the signed consent page closing it out" : "") +
    '. Print it or save it as a PDF from the print screen — hand the customer the whole thing.</p>' +
    '<div class="btnrow"><button class="btn primary" id="pk-print" type="button">🖨 Print / save packet as PDF</button></div></div>' +
    '<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">' + packetHtml(job) + "</div>" +
    stepNav(job, 3, 5, "To invoice");
  body.querySelector("#pk-print").addEventListener("click", () => printDoc(packetHtml(job), "packet-" + job.number + ".html"));
  bindNav(job, body);
}

/* ----- Step 6: invoice ----- */
function renderStepInvoice(job, body) {
  let inner = '<div class="panel"><h3>Invoice</h3>';
  if (!job.invoice) {
    const can = job.approval && job.approval.status === "signed";
    inner += '<p class="subtle">One tap turns the approved estimate into an invoice carrying ' +
      (settings.paymentLink ? "your own payment link — money straight to your account." : "your payment link (none set yet — add it in Setup).") + "</p>" +
      '<div class="btnrow"><button class="btn good" id="inv-make" type="button" ' + (can ? "" : "disabled") + ">Convert approved estimate → invoice</button></div>" +
      (can ? "" : '<p class="tiny">The estimate needs its approval signature first (Approval step).</p>');
  } else {
    const inv = job.invoice;
    inner += '<p class="subtle">Invoice <strong>' + esc(inv.number) + "</strong> · issued " + esc(fmtDate(inv.issuedAt)) +
      " · due " + esc(fmtDate(inv.dueDate)) + " · <strong>" + (inv.status === "paid" ? "PAID" : "UNPAID") + "</strong></p>" +
      '<div class="btnrow"><button class="btn primary" id="inv-print" type="button">🖨 Print / save invoice as PDF</button>' +
      (inv.paymentLink ? '<a class="btn" href="' + esc(inv.paymentLink) + '" target="_blank" rel="noopener">Open your payment link</a>' : "") +
      '<button class="btn" id="inv-paid" type="button">' + (inv.status === "paid" ? "Mark unpaid" : "Mark paid") + "</button>" +
      '<button class="btn good" id="inv-done" type="button">✓ Done — back to Jobs</button></div>' +
      (inv.status === "paid" ? '<p class="tiny">Paid — this job is <strong>closed</strong>. It stays in your Jobs list marked Closed; reopen it any time to reprint or adjust.</p>' : "") +
      (inv.paymentLink ? "" : '<p class="tiny" style="color:var(--warn)">No payment link was set when this invoice was created — it prints without one. Add your link in Setup for future invoices.</p>');
  }
  inner += "</div>";
  if (job.invoice) inner += '<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">' + invoiceHtml(job) + "</div>";
  inner += stepNav(job, 4, null);
  body.innerHTML = inner;
  const make = body.querySelector("#inv-make");
  if (make) make.addEventListener("click", () => {
    const r = convertToInvoice(job, settings);
    if (!r.ok) { toast(r.error); return; }
    settings = loadSettings();
    persist(job);
    toast("Invoice " + r.invoice.number + " created");
    renderJob();
  });
  const pr = body.querySelector("#inv-print");
  if (pr) pr.addEventListener("click", () => printDoc(invoiceHtml(job), "invoice-" + job.invoice.number + ".html"));
  const pd = body.querySelector("#inv-paid");
  if (pd) pd.addEventListener("click", () => {
    job.invoice.status = job.invoice.status === "paid" ? "unpaid" : "paid";
    job.status = job.invoice.status === "paid" ? "closed" : "invoiced";
    persist(job);
    toast(job.invoice.status === "paid" ? "Invoice paid — job closed" : "Invoice marked unpaid — job reopened");
    renderJob();
  });
  const dn = body.querySelector("#inv-done");
  if (dn) dn.addEventListener("click", () => {
    persist(job);
    renderJobs();
    showView("jobs");
  });
  bindNav(job, body);
}

};

  loadJobs, saveJobs, newJob, persistNewJob, findJob,

  convertToInvoice, jobStatusLabel, CONSENT_SENTENCE, Dictation
};

renderJobs();
showView("jobs");
