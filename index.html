<link rel="manifest" href='data:application/manifest+json,{"name":"Hestrel","short_name":"Hestrel","start_url":".","display":"standalone","background_color":"%230a0e14","theme_color":"%230a0e14","description":"Field estimates with a signed witness. Every Estimate Has a Witness."}'>
<title>Hestrel — Every Estimate Has a Witness.</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0d1320; --panel:#121a29; --panel2:#182338; --line:#22334f;
    --text:#e9eff8; --muted:#93a4bd; --faint:#647691;
    --accent:#33a1ff; --accent2:#7cc4ff; --accent-dim:rgba(51,161,255,.14);
    --good:#2fbf71; --warn:#ffb020; --bad:#ff5d5d;
    --radius:14px;
  }
  html{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4{margin:0 0 .4em; line-height:1.2}
  p{margin:0 0 .7em}
  a{color:var(--accent2)}
  button{font:inherit; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--text)}
  .hidden{display:none !important}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 16px; background:rgba(10,14,20,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .brand svg{flex:0 0 auto}
  .brand img{flex:0 0 auto; border-radius:9px; display:block}
  .brand-name{font-size:21px; font-weight:800; letter-spacing:.14em}
  .brand-name span{color:var(--accent)}
  .brand-tag{font-size:11.5px; color:var(--muted); letter-spacing:.04em; white-space:nowrap}
  .topnav{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
  .navbtn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:9px 15px; border-radius:999px; font-weight:600; font-size:14.5px;
  }
  .navbtn.primary{background:var(--accent); border-color:var(--accent); color:#04121f}
  .navbtn:active{transform:translateY(1px)}

  main{max-width:880px; margin:0 auto; padding:18px 14px 90px}
  .banner{
    max-width:880px; margin:12px auto 0; padding:11px 14px; border-radius:10px;
    background:rgba(255,93,93,.13); border:1px solid var(--bad); color:#ffc9c9; font-size:14.5px;
  }

  /* ---------- generic panels & forms ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .panel h2{font-size:19px}
  .panel h3{font-size:16px; color:var(--accent2)}
  .subtle{color:var(--muted); font-size:14px}
  .tiny{color:var(--faint); font-size:12.5px}
  label.field{display:block; margin-bottom:13px}
  label.field > span{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:.02em}
  .input, input[type="text"].input, input[type="number"].input, input[type="tel"].input,
  input[type="email"].input, input[type="url"].input, input[type="date"].input, textarea.input, select.input{
    width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; outline:none;
  }
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim)}
  textarea.input{min-height:84px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr} }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:12px 18px; border-radius:12px; font-weight:700; font-size:15.5px; text-decoration:none;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#04121f}
  .btn.good{background:var(--good); border-color:var(--good); color:#04150b}
  .btn.danger{background:transparent; border-color:var(--bad); color:#ff9c9c}
  .btn.small{padding:8px 13px; font-size:14px; border-radius:10px}
  .btn:disabled{opacity:.42; cursor:not-allowed}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .btnrow .spacer{flex:1}
  .checkline{display:flex; gap:10px; align-items:flex-start; margin:10px 0}
  .checkline input{width:20px; height:20px; margin-top:2px; accent-color:var(--accent)}

  /* ---------- job list ---------- */
  .jobcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 17px; margin-bottom:11px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .jobcard .jc-main{flex:1 1 220px; min-width:0}
  .jobcard .jc-num{font-weight:800; letter-spacing:.03em}
  .jobcard .jc-cust{color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .jobcard .jc-total{font-weight:800; font-size:17px}
  .chip{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
    border:1px solid var(--line); color:var(--muted); letter-spacing:.02em;
  }
  .chip.blue{color:var(--accent2); border-color:var(--accent)}
  .chip.green{color:#7fe6ae; border-color:var(--good)}
  .chip.amber{color:#ffd27c; border-color:var(--warn)}
  .empty{
    text-align:center; padding:38px 18px; color:var(--muted);
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* ---------- steps ---------- */
  .steps{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .stepbtn{
    flex:1 1 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:11px; padding:10px 6px; font-size:13.5px; font-weight:700; text-align:center;
  }
  .stepbtn .n{
    display:inline-flex; width:21px; height:21px; border-radius:50%; margin-right:6px;
    background:var(--panel2); border:1px solid var(--line); align-items:center; justify-content:center; font-size:12px;
  }
  .stepbtn.active{color:var(--text); border-color:var(--accent); background:var(--accent-dim)}
  .stepbtn.active .n{background:var(--accent); color:#04121f; border-color:var(--accent)}
  .stepbtn.done{color:#7fe6ae}
  .stepbtn.done .n{background:var(--good); color:#04150b; border-color:var(--good)}
  .stepbtn.locked{opacity:.45}

  /* ---------- signature pad ---------- */
  .consent-text{
    background:var(--bg2); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:10px; padding:13px 15px; font-size:15px; margin-bottom:14px;
  }
  .sigwrap{background:#fff; border-radius:12px; padding:8px; position:relative}
  .sigwrap canvas{display:block; width:100%; height:190px; touch-action:none; border-radius:6px}
  .sigwrap .sigline{
    position:absolute; left:26px; right:26px; bottom:34px; border-bottom:2px solid #b9c4d4; pointer-events:none;
  }
  .sigwrap .sigx{
    position:absolute; left:26px; bottom:38px; color:#8fa0b5; font-size:19px; pointer-events:none;
  }
  .sig-saved{background:#fff; border-radius:12px; padding:10px; text-align:center}
  .sig-saved img{max-width:100%; height:110px; object-fit:contain}

  /* ---------- catalog & line items ---------- */
  .catgroup{margin-bottom:8px; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .catgroup > button.cathead{
    width:100%; text-align:left; background:var(--panel2); color:var(--text); border:0;
    padding:13px 15px; font-weight:700; font-size:15.5px; display:flex; justify-content:space-between; align-items:center;
  }
  .catitems{background:var(--bg2)}
  .catrow{
    display:flex; align-items:center; gap:10px; padding:10px 15px; border-top:1px solid var(--line);
  }
  .catrow .cl{flex:1; min-width:0}
  .catrow .cl .u{color:var(--faint); font-size:12.5px}
  .catrow .cp{font-weight:700; white-space:nowrap}
  .catrow .cp.noprice{color:var(--warn); font-weight:600; font-size:13px}
  table.items{width:100%; border-collapse:collapse; margin-top:6px}
  table.items th{
    text-align:left; font-size:12px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase;
    padding:6px 6px; border-bottom:1px solid var(--line);
  }
  table.items td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.items input{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px 9px; width:100%}
  table.items input.qty{max-width:74px}
  table.items input.price{max-width:110px}
  table.items .lt{text-align:right; font-weight:700; white-space:nowrap}
  table.items th.r, table.items td.r{text-align:right}
  .iconbtn{
    background:transparent; border:1px solid var(--line); color:#ff9c9c; border-radius:8px;
    width:36px; height:36px; font-size:16px; line-height:1;
  }
  .totals{margin-top:14px; border-top:2px solid var(--line); padding-top:12px}
  .totals .trow{display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:15.5px}
  .totals .trow.grand{font-size:20px; font-weight:800; border-top:1px solid var(--line); margin-top:8px; padding-top:10px}
  .totals .taxin{display:flex; align-items:center; gap:6px}
  .totals .taxin input{width:76px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:6px 8px}

  /* ---------- price setup ---------- */
  .pricerow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
  .pricerow .pl{flex:1; min-width:0; font-size:14.5px}
  .pricerow .pl .u{color:var(--faint); font-size:12px}
  .pricerow input{width:118px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:8px 9px}

  .thumb{max-width:180px; border-radius:10px; border:1px solid var(--line); display:block; margin-top:8px}
  .dictation-off{
    border:1px dashed var(--line); border-radius:12px; padding:13px 15px; color:var(--muted); font-size:14.5px;
    background:rgba(51,161,255,.05);
  }
  .dictation-on{
    border:1px solid var(--line); border-radius:12px; padding:13px 15px; font-size:14.5px;
    background:rgba(51,161,255,.05);
  }
  .dc-status{font-size:13.5px; color:var(--muted); margin-top:8px}
  .dc-status.live{color:var(--accent); font-weight:700}
  .dc-status.err{color:var(--warn); font-weight:600}
  .dc-live{
    border:1px dashed var(--line); border-radius:8px; padding:10px 12px; min-height:42px; margin-top:10px;
    white-space:pre-wrap; background:var(--bg2);
  }
  .dc-live .interim{color:var(--muted)}
  .dc-raw{
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:12px;
    font-size:13.5px; white-space:pre-wrap; background:var(--bg2);
  }
  .prop{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; background:var(--panel2)}
  .prop .plabel{font-weight:700}
  .prop .pmatch{color:var(--muted); font-size:12.5px; margin-top:2px}
  .prop .prow{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
  .prop .prow label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); flex:1; min-width:110px}
  .prop .prow label.narrow{flex:0 0 84px; min-width:84px}
  .prop .prow input{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--text)}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); color:var(--text); border:1px solid var(--accent); border-radius:999px;
    padding:10px 20px; font-weight:600; font-size:14.5px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:99; max-width:92vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ---------- printable document (packet / invoice) ---------- */
  #print-area{display:none}
  @media print{
    body{background:#fff}
    .topbar, main, #toast, .banner{display:none !important}
    #print-area{display:block !important}
    .doc{padding:6px 4px}
    @page{margin:14mm}
  }
</style>
</head>

/* =====================================================================
   CORE — storage, settings, money, job model.
   These functions are deliberately DOM-free so the whole flow
   (setup -> estimate -> consent -> approval -> invoice) can be
   exercised and tested headlessly. The UI layer below calls them.
   ===================================================================== */
const LS_KEYS = {
  settings: "hestrel.settings.v1",
  prices:   "hestrel.prices.v1",
  jobs:     "hestrel.jobs.v1"
};

let storageFault = null; // set to a message string when a save fails
function lsLoad(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null || raw === undefined) return fallback;
    const v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  } catch (e) { return fallback; }
}
function lsSave(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    if (storageFault) { storageFault = null; if (typeof onStorageRecovered === "function") onStorageRecovered(); }
    return true;
  } catch (e) {
    storageFault = "Saving failed on this device (storage may be full). What you see on screen is NOT saved yet — free up space or export the packet before closing.";
    if (typeof onStorageError === "function") onStorageError(storageFault);
    return false;
  }
}

/* ---------- money: integer cents everywhere ---------- */
function toCents(dollars) {
  if (dollars === null || dollars === undefined || dollars === "") return 0;
  const n = Number(dollars);
  return isFinite(n) ? Math.round(n * 100) : 0;
}
function fmtMoney(cents) {
  const n = (Number(cents) || 0) / 100;
  return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
}
function fmtDateTime(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }); }
  catch (e) { return String(ts); }
}
function fmtDate(ts) {
  if (!ts) return "";
  try { return new Date(ts).toLocaleDateString("en-US", { dateStyle: "medium" }); }
  catch (e) { return String(ts); }
}
function uid(prefix) {
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- settings (business setup) ---------- */

  paymentLink: "",          // the BUSINESS'S OWN payment link — never Toastid's
  paymentNote: "Payments go directly to the business through its own payment provider. Hestrel / Toastid Tech never handles or holds these funds.",
  partsWarrantyDefault: "",

  maintenanceOfferDefault: "Ask us about our annual maintenance plan — two tune-ups a year and priority scheduling.",
  includeConsentPage: true,
  estCounter: 1000,
  invCounter: 1000
};
function loadSettings() {
  const s = lsLoad(LS_KEYS.settings, {});
  return Object.assign({}, DEFAULT_SETTINGS, s || {});
}
function saveSettings(s) { return lsSave(LS_KEYS.settings, s); }

/* ---------- price book: catalog ships price-null; the business fills

function loadPrices() { return lsLoad(LS_KEYS.prices, {}) || {}; }
function savePrices(p) { return lsSave(LS_KEYS.prices, p); }
function catalogItemById(id) {
  for (const cat of (CATALOG.categories || [])) {
    for (const it of (cat.items || [])) if (it.id === id) return it;
  }
  return null;
}
function effectivePriceCents(itemId, priceBook) {
  const pb = priceBook || loadPrices();
  if (pb[itemId] !== undefined && pb[itemId] !== null && pb[itemId] !== "") return toCents(pb[itemId]);
  const item = catalogItemById(itemId);
  if (item && item.price !== null && item.price !== undefined) return toCents(item.price);
  return null; // no price set anywhere — builder must ask
}

/* Seasonal sort: heating surfaces first Oct–Mar, cooling first Apr–Sep. */
function currentSeason() {
  const m = new Date().getMonth(); // 0=Jan
  return (m >= 9 || m <= 2) ? "heat" : "cool";
}
function categorySeason(cat) {
  if (cat.seasonalPriority) return cat.seasonalPriority;
  let heat = 0, cool = 0;
  for (const it of (cat.items || [])) {
    if (it.seasonalPriority === "heat") heat++;
    if (it.seasonalPriority === "cool") cool++;
  }
  if (heat > cool) return "heat";
  if (cool > heat) return "cool";
  return null;
}
function sortedCategories(season) {
  const s = season || currentSeason();
  const cats = (CATALOG.categories || []).slice();
  return cats.sort((a, b) => {
    const pa = categorySeason(a) === s ? 0 : 1;
    const pb = categorySeason(b) === s ? 0 : 1;
    return pa - pb;
  });
}

/* ---------- jobs ---------- */
function loadJobs() { return lsLoad(LS_KEYS.jobs, []) || []; }
function saveJobs(jobs) { return lsSave(LS_KEYS.jobs, jobs); }
function findJob(jobs, id) { return jobs.find(j => j.id === id) || null; }

function newJob(settings) {
  const s = settings || loadSettings();
  const now = Date.now();
  return {
    id: uid("job"),
    number: "EST-" + (++s.estCounter),
    createdAt: now,
    updatedAt: now,
    status: "draft",
    customer: { name: "", phone: "", email: "", address: "" },
    serviceAddress: "",
    equipment: { make: "", model: "", serial: "", systemType: "", tonnage: "", btu: "", refrigerantType: "", systemAgeYears: "", nameplatePhoto: null },
    consent: { status: "pending", signerName: "", signatureData: null, signedAt: null, place: "", covered: "the on-site conversation for this visit" },
    items: [],
    taxRate: (s.taxRate === null || s.taxRate === undefined) ? 0 : Number(s.taxRate),
    notes: "",
    packet: {
      partsWarranty: s.partsWarrantyDefault || "",
      laborWarranty: s.laborWarrantyDefault || "",
      permitNote: s.permitNoteDefault || "",

    },
    approval: { status: "pending", signerName: "", signatureData: null, signedAt: null },
    invoice: null
  };
}
function persistNewJob(jobs, job, settings) {
  // settings counter was bumped in newJob(); persist both, disk-first.
  saveSettings(settings);
  jobs.unshift(job);
  saveJobs(jobs);
  return job;
}
function touchJob(jobs, job) {
  job.updatedAt = Date.now();
  saveJobs(jobs);
}

/* ---------- line items & totals ---------- */
function addCatalogItem(job, itemId, priceBook) {
  const item = catalogItemById(itemId);
  if (!item) return null;
  const priceCents = effectivePriceCents(itemId, priceBook);
  const line = {
    id: uid("ln"),
    catalogId: itemId,
    label: item.label,
    unit: item.unit || "flat",
    qty: 1,
    priceCents: priceCents === null ? 0 : priceCents,
    priceUnset: priceCents === null
  };
  job.items.push(line);
  return line;
}
function addCustomItem(job, label) {
  const line = { id: uid("ln"), catalogId: null, label: label || "Custom item", unit: "flat", qty: 1, priceCents: 0, priceUnset: false };
  job.items.push(line);
  return line;
}
function removeItem(job, lineId) {
  job.items = job.items.filter(l => l.id !== lineId);
}
function lineTotalCents(line) {
  const q = Number(line.qty);
  return Math.round((isFinite(q) ? q : 0) * (Number(line.priceCents) || 0));
}
function computeTotals(job) {
  let subtotal = 0;
  for (const l of (job.items || [])) subtotal += lineTotalCents(l);
  const rate = Number(job.taxRate) || 0;
  const tax = Math.round(subtotal * rate / 100);
  return { subtotalCents: subtotal, taxCents: tax, totalCents: subtotal + tax, taxRate: rate };
}

/* ---------- consent & approval (the two signature moments, distinct) -- */
const CONSENT_SENTENCE = "You agreed to be recorded, to have the conversation transcribed and summarized by AI, and to have it stored by the business named above together with this estimate.";
function consentResolved(job) {
  return job.consent && (job.consent.status === "signed" || job.consent.status === "declined");
}
function signConsent(job, signerName, signatureData, place) {
  job.consent = {
    status: "signed",
    signerName: String(signerName || "").trim(),
    signatureData: signatureData || null,
    signedAt: Date.now(),
    place: place || job.serviceAddress || job.customer.address || "",
    covered: "the on-site conversation for this visit"
  };
  if (job.status === "draft") job.status = "in-progress";
  return job.consent;
}
function declineConsent(job) {
  // Graceful refusal path: written-notes mode, no recording. Never pressure.
  job.consent = {
    status: "declined",
    signerName: "", signatureData: null, signedAt: Date.now(),
    place: job.serviceAddress || job.customer.address || "",
    covered: "the on-site conversation for this visit"
  };
  if (job.status === "draft") job.status = "in-progress";
  return job.consent;
}
function signApproval(job, signerName, signatureData) {
  job.approval = {
    status: "signed",
    signerName: String(signerName || "").trim(),
    signatureData: signatureData || null,
    signedAt: Date.now()
  };
  job.status = "approved";
  return job.approval;
}

/* ---------- invoice conversion: carries the business's OWN link ------ */
function convertToInvoice(job, settings) {
  if (!job.approval || job.approval.status !== "signed") {
    return { ok: false, error: "The estimate must be approved and signed before it can become an invoice." };
  }
  if (job.invoice) return { ok: true, invoice: job.invoice, already: true };
  const s = settings || loadSettings();
  const totals = computeTotals(job);
  job.invoice = {
    number: "INV-" + (++s.invCounter),
    issuedAt: Date.now(),
    dueDate: Date.now() + 14 * 24 * 60 * 60 * 1000,
    status: "unpaid",
    totalCents: totals.totalCents,
    paymentLink: s.paymentLink || "",       // snapshot of the business's own link
    paymentNote: s.paymentNote || "",
    estimateNumber: job.number
  };
  saveSettings(s);
  job.status = "invoiced";
  return { ok: true, invoice: job.invoice };
}
function jobStatusLabel(job) {
  if (job.invoice) return job.invoice.status === "paid" ? "Closed" : "Invoiced";
  if (job.approval && job.approval.status === "signed") return "Approved";
  if (job.consent && job.consent.status === "signed") return "Consent signed";
  if (job.consent && job.consent.status === "declined") return "Notes mode";
  return "Draft";
}

  if (idx <= 1) return true;

function renderJob() {
  const job = currentJob();

  bar += '<div class="steps">';
  STEPS.forEach((name, i) => {
    const allowed = stepAllowed(job, i);
    const done = (i === 1 && consentResolved(job)) || (i === 3 && job.approval.status === "signed") ||
                 (i === 5 && !!job.invoice) || (i < currentStep && allowed);
    bar += '<button type="button" class="stepbtn' + (i === currentStep ? " active" : "") +
      (done ? " done" : "") + (!allowed ? " locked" : "") + '" data-step="' + i + '">' +

    else currentStep = idx;

function downscaleImage(file, maxPx, cb) {
  // Performance rule: shrink at capture, never hold the full-size image.
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cb(cv.toDataURL("image/jpeg", 0.78), null);
      } catch (err) { cb(null, err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); cb(null, new Error("image load failed")); };
    img.src = url;
  } catch (err) { cb(null, err); }
}

/* ----- signature pad (canvas, pointer events, disk-first on save) ----- */
function makePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false, dirty = false, last = null;
  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const prev = dirty ? canvas.toDataURL() : null;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#12233c";
    if (prev) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = prev; }
  }
  function pos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", (ev) => {
    drawing = true; last = pos(ev);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!drawing) return;
    const p = pos(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; dirty = true;
    ev.preventDefault();
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
  return {
    fit,
    isEmpty: () => !dirty,
    clear: () => { const r = canvas.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); dirty = false; },
    dataURL: () => canvas.toDataURL("image/png")
  };
}

  wrap.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {

/* ----- Dictation panel (build step 4 UI) -----
 * The mic exists only when consent is SIGNED — the consent sentence
 * the customer signed IS the recording agreement. Pending consent:
 * locked (no signature yet). Declined consent: locked for good on
 * this job — written-notes mode means NO recording, by design.
 * Dictated words are never final: they structure into proposals the
 * tech accepts / edits / dismisses, and only an accept reaches
 * job.items, through addCatalogItem — the same path as a catalog tap.
 */
let dictationUi = null;
let dictationSession = null;

function dictationStateFor(job) {
  if (!dictationUi || dictationUi.jobId !== job.id) {
    dictationUi = { jobId: job.id, status: "idle", finalText: "", interimText: "", proposals: [], rawTranscript: "", notesText: "", error: "" };
  }
  return dictationUi;
}
function dictationStatusText(st) {
  if (st.status === "listening") return "● Listening… speak now, then tap Stop & review.";
  if (st.status === "processing") return "Structuring what you said…";
  if (st.status === "error") return "⚠ " + (st.error || "Dictation hit a problem — you can type the notes instead.");
  if (st.status === "done") return "Done — review the proposals below. Nothing counts until you accept it.";
  return "Ready. Talk through the visit — findings, parts, prices — then review what Hestrel heard.";
}
function dictationLiveHtml(st) {
  const fin = st.finalText ? esc(st.finalText) : "";
  const inter = st.interimText ? ' <span class="interim">' + esc(st.interimText) + "</span>" : "";
  if (!fin && !inter) return '<span class="interim">Your words appear here as you speak…</span>';
  return fin + inter;
}
function dictationPanelHtml(job) {
  const st = dictationStateFor(job);
  if (job.consent.status === "declined") {
    return '<div class="dictation-off">🎙 <strong>Dictation is off for this job.</strong> The customer chose written-notes mode — no recording after a declined consent. Type the visit notes below.</div>';
  }
  if (job.consent.status !== "signed") {
    return '<div class="dictation-off">🎙 <strong>Dictation is locked.</strong> No mic opens until the consent is signed on the Consent step — that signature is the recording agreement.</div>';
  }
  if (!Dictation.supported) {
    return '<div class="dictation-off">🎙 <strong>Dictation isn\'t supported in this browser</strong> — type notes below. (Dictation works in Chrome on Android and desktop.)</div>';
  }
  const listening = st.status === "listening";
  return '<div class="dictation-on"><div><strong>🎙 Dictate the visit</strong></div>' +
    '<p class="tiny" style="margin:4px 0 0">e.g. “Replace the igniter and the capacitor, add a diagnostic fee.” Hestrel matches your catalog + glossary (' +
    esc((CATALOG.dictationGlossary || []).slice(0, 6).join(", ")) + '…) and proposes line items — you review every one before it counts.</p>' +
    '<div class="dc-status' + (listening ? " live" : "") + (st.status === "error" ? " err" : "") + '" id="dc-status">' + esc(dictationStatusText(st)) + "</div>" +
    '<div class="dc-live" id="dc-live">' + dictationLiveHtml(st) + "</div>" +
    '<div class="btnrow">' +
    (listening
      ? '<button class="btn danger" id="dc-stop" type="button">■ Stop &amp; review</button>'
      : '<button class="btn primary" id="dc-start" type="button">🎙 Start dictation</button>') +
    (!listening && st.finalText ? '<button class="btn" id="dc-restructure" type="button">Re-read transcript</button><button class="btn ghost" id="dc-clear" type="button">Clear</button>' : "") +
    "</div>" +
    '<div id="dc-review">' + dictationReviewHtml(job, st) + "</div></div>";
}
function dictationReviewHtml(job, st) {
  if (!st.rawTranscript) return "";
  let h = '<div class="dc-raw"><div class="tiny">WHAT HESTREL HEARD (raw — kept so nothing is silently dropped)</div>' + esc(st.rawTranscript) + "</div>";
  if (st.notesText) {
    h += '<p class="tiny" style="margin-top:8px">Words that didn\'t match the catalog were added to your visit notes below: “' + esc(st.notesText) + '”</p>';
  }
  if (!st.proposals.length) {
    h += '<p class="subtle" style="margin-top:8px">No catalog items matched — everything went to the visit notes. Add line items from the catalog above.</p>';
    return h;
  }
  h += '<h4 style="margin:12px 0 2px">Proposed line items — your review is the edit pass</h4>';
  st.proposals.forEach((p, i) => {
    const eff = (p.priceCents !== null && p.priceCents !== undefined) ? p.priceCents : effectivePriceCents(p.catalogId, priceBook);
    h += '<div class="prop">' +
      '<div class="plabel">' + esc(p.label) + "</div>" +
      '<div class="pmatch">heard: “' + esc(p.matchedText) + '” · per ' + esc(p.unit || "flat") + "</div>" +
      '<div class="prow">' +
      '<label>Label<input type="text" data-pf="label" data-pi="' + i + '" value="' + esc(p.label) + '"></label>' +
      '<label class="narrow">Qty<input type="number" data-pf="qty" data-pi="' + i + '" min="0" step="0.25" inputmode="decimal" value="' + esc(p.qty) + '"></label>' +
      '<label class="narrow">Price $<input type="number" data-pf="price" data-pi="' + i + '" min="0" step="0.01" inputmode="decimal" placeholder="—" value="' + (eff === null ? "" : String(eff / 100)) + '"></label>' +
      "</div>" +
      '<div class="btnrow"><button class="btn small primary" type="button" data-paccept="' + i + '">Accept</button>' +
      '<button class="btn small ghost" type="button" data-pdismiss="' + i + '">Dismiss</button></div></div>';
  });
  return h;
}
function finishDictation(job) {
  const st = dictationStateFor(job);
  dictationSession = null;
  const text = (st.finalText || "").trim();
  if (!text) {
    st.status = "idle";
    renderJob(currentStep);
    toast("Didn't catch anything — try dictation again");
    return;
  }
  const res = Dictation.structureTranscript(text);
  const sameRound = !!st.rawTranscript && st.rawTranscript === res.raw;
  if (sameRound) {
    // Re-read of the same transcript: replace proposals, don't duplicate.
    st.proposals = res.proposals;
  } else {
    st.proposals = st.proposals.concat(res.proposals);
    st.rawTranscript = st.rawTranscript ? (st.rawTranscript + " " + res.raw) : res.raw;
    if (res.notesText) {
      st.notesText = st.notesText ? (st.notesText + " " + res.notesText) : res.notesText;
      job.notes = job.notes ? (String(job.notes).replace(/\s+$/, "") + "\n" + res.notesText) : res.notesText;
      persist(job);
    }
  }
  st.status = "done";
  st.interimText = "";
  renderJob(currentStep);
}
function wireDictation(job, body) {
  const st = dictationStateFor(job);
  const startBtn = body.querySelector("#dc-start");
  const stopBtn = body.querySelector("#dc-stop");
  const reBtn = body.querySelector("#dc-restructure");
  const clearBtn = body.querySelector("#dc-clear");
  if (startBtn) startBtn.addEventListener("click", () => {
    st.error = "";
    st.interimText = "";
    try {
      dictationSession = Dictation.start(job, {
        onInterim: (txt) => {
          st.interimText = txt;
          const el = document.getElementById("dc-live");
          if (el) el.innerHTML = dictationLiveHtml(st);
        },
        onFinal: (txt) => {
          st.finalText = txt;
          st.interimText = "";
          const el = document.getElementById("dc-live");
          if (el) el.innerHTML = dictationLiveHtml(st);
        },
        onError: (msg) => { st.status = "error"; st.error = msg; renderJob(currentStep); },
        onEnd: () => { if (st.status === "listening" || st.status === "processing") { st.status = "processing"; finishDictation(job); } }
      });
      st.status = "listening";
      renderJob(currentStep);
    } catch (e) {
      st.status = "error";
      st.error = e.message;
      renderJob(currentStep);
    }
  });
  if (stopBtn) stopBtn.addEventListener("click", () => {
    st.status = "processing";
    if (dictationSession) dictationSession.stop();
    else finishDictation(job);
  });
  if (reBtn) reBtn.addEventListener("click", () => finishDictation(job));
  if (clearBtn) clearBtn.addEventListener("click", () => {
    st.finalText = ""; st.interimText = ""; st.proposals = []; st.rawTranscript = ""; st.notesText = ""; st.status = "idle"; st.error = "";
    renderJob(currentStep);
  });
  body.querySelectorAll("[data-paccept]").forEach(btn => btn.addEventListener("click", () => {
    const i = Number(btn.getAttribute("data-paccept"));
    const p = st.proposals[i];
    if (!p) return;
    const val = (f) => {
      const inp = body.querySelector('[data-pf="' + f + '"][data-pi="' + i + '"]');
      return inp ? inp.value : "";
    };
    const line = addCatalogItem(job, p.catalogId, priceBook);
    if (!line) return;
    const lbl = String(val("label") || "").trim();
    if (lbl) line.label = lbl;
    const q = Number(val("qty"));
    if (isFinite(q) && q > 0) line.qty = q;
    const pr = val("price");
    if (pr !== "" && isFinite(Number(pr))) { line.priceCents = Math.round(Number(pr) * 100); line.priceUnset = false; }
    persist(job);
    st.proposals.splice(i, 1);
    renderJob(currentStep);
    toast("Added: " + line.label);
  }));
  body.querySelectorAll("[data-pdismiss]").forEach(btn => btn.addEventListener("click", () => {
    const i = Number(btn.getAttribute("data-pdismiss"));
    st.proposals.splice(i, 1);
    renderJob(currentStep);
  }));
}

/* ----- Step 4: estimate approval signature (separate from consent) ---- */
function renderStepApproval(job, body) {
  const ap = job.approval;

  let inner = '<div class="panel"><h3>Estimate approval</h3>' +

    job.items.length + ' line item' + (job.items.length === 1 ? "" : "s") + ", tax included as shown in the packet).</p>" +
    "<p>Signing below says: I approve this estimate — the work described, the price shown, and the terms — and I authorize " +
    esc(settings.businessName || "the business") + " to proceed.</p></div>";
  if (ap.status === "signed") {
    inner += '<div class="sig-saved"><img src="' + ap.signatureData + '" alt="Approval signature"></div>' +
      '<p class="subtle" style="margin-top:10px">Approved by <strong>' + esc(ap.signerName) + "</strong> · " + esc(fmtDateTime(ap.signedAt)) + "</p>" +
      '<div class="btnrow"><button class="btn danger" id="ap-redo" type="button">Clear &amp; re-sign</button>' +
      '<button class="btn good" id="ap-invoice" type="button">Convert to invoice →</button></div>';
  } else {
    if (!job.items.length) inner += '<p class="subtle" style="color:var(--warn)">Heads up: this estimate has no line items yet — go back to Estimate and add some before the customer signs.</p>';
    inner += fld("Approver's printed name", '<input class="input" id="ap-name" value="' + esc(ap.signerName || job.customer.name || "") + '" autocomplete="name">') +
      '<div class="sigwrap"><canvas id="ap-pad"></canvas><div class="sigline"></div><div class="sigx">✕</div></div>' +
      '<div class="btnrow"><button class="btn" id="ap-clear" type="button">Clear</button>' +
      '<button class="btn primary" id="ap-sign" type="button">Sign approval &amp; save</button></div>';
  }
  inner += "</div>" + stepNav(job, 2, 4, "To packet");
  body.innerHTML = inner;

  if (ap.status !== "signed") {
    const pad = makePad(body.querySelector("#ap-pad"));
    requestAnimationFrame(() => pad.fit());
    body.querySelector("#ap-clear").addEventListener("click", () => pad.clear());
    body.querySelector("#ap-sign").addEventListener("click", () => {
      const name = body.querySelector("#ap-name").value.trim();
      if (!name) { toast("Add the approver's printed name first"); return; }
      if (pad.isEmpty()) { toast("The signature box is empty — sign above the line"); return; }
      signApproval(job, name, pad.dataURL());
      persist(job);
      toast("Approval signed & saved");
      renderJob();
    });
  } else {
    body.querySelector("#ap-redo").addEventListener("click", () => {
      if (!confirm("Clear the saved approval signature and sign again?")) return;
      job.approval = { status: "pending", signerName: ap.signerName, signatureData: null, signedAt: null };
      if (job.status === "approved") job.status = "in-progress";
      persist(job); renderJob();
    });
    body.querySelector("#ap-invoice").addEventListener("click", () => { currentStep = 5; renderJob(); });
  }
  bindNav(job, body);
}

function printDoc(html, filename) {
  // Keep the in-page print area filled as a fallback for browsers
  // where window.print() works directly.
  const area = document.getElementById("print-area");
  area.innerHTML = html;
  const doc =
    '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    "<title>Hestrel document</title><style>" + DOC_CSS +
    "\nbody{margin:0;background:#fff}" +
    "\n.printbar{position:sticky;top:0;background:#14181f;padding:10px;text-align:center}" +
    "\n.printbar button{font:600 15px Helvetica,Arial,sans-serif;padding:10px 22px;border:0;border-radius:8px;background:#33a1ff;color:#fff;cursor:pointer}" +
    "\n@media print{.printbar{display:none}}" +
    "\n@page{margin:14mm}" +
    "</style></head><body>" +
    '<div class="printbar"><button type="button" onclick="window.print()">🖨 Print / save as PDF</button></div>' +
    html +
    '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},300);});<\/script>' +
    "</body></html>";
  // Best case: a real browser tab, where print works.
  let w = null;
  try { w = window.open("", "_blank"); } catch (e) { w = null; }
  if (w && w.document) {
    w.document.open();
    w.document.write(doc);
    w.document.close();
    toast("Opened in a new tab — print or save as PDF there");
    return;
  }
  // In-app previews and embedded webviews block popups AND swallow
  // window.print() — the tap used to do nothing at all. Fall back to
  // downloading the document as a file: the user opens it in any
  // browser and prints / saves as PDF from there.
  try {
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || "hestrel-document.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("This viewer blocks print popups — the document downloaded instead. Open the file and print / save as PDF from there.");
  } catch (e) {
    window.print();
  }
}

/* =====================================================================
   STEP 4 — dictation -> structured line items (BUILT).
   Capture route: the browser Web Speech API (SpeechRecognition /
   webkitSpeechRecognition) — no backend, no API keys. Results stream
   in event by event (interim + final), so no audio recording is ever
   buffered or accumulated in memory; only the running transcript text
   is kept. That satisfies the original step-4 streaming intent
   (chunks out, never whole-in-memory) using the platform's own
   streaming recognizer instead of MediaRecorder.
   The consent gate is absolute: Dictation.start refuses unless the
   job's consent is SIGNED — pending means no signature yet, declined
   means the customer chose written-notes mode (no recording on that
   job, ever). Dictated words are never final: structureTranscript
   turns them into PROPOSED line items matched against CATALOG +
   CATALOG.dictationGlossary, and a proposal reaches job.items only
   when the tech accepts it in the review, via addCatalogItem.
   ===================================================================== */

/* Normalization is character-aligned with the raw transcript (every
 * non-word char becomes exactly one space), so match offsets found in
 * the normalized text index straight back into what the tech said. */
function dictNorm(raw) {
  return String(raw || "").toLowerCase().replace(/[^a-z0-9.$]/g, " ");
}
function dictTokens(norm) {
  const out = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(norm))) out.push({ text: m[0], start: m.index, end: m.index + m[0].length });
  return out;
}
const DICT_NUMBER_WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12 };
const DICT_QTY_FILLER = { the: 1, a: 1, an: 1, new: 1, old: 1, of: 1, x: 1, more: 1, lb: 1, lbs: 1, pound: 1, pounds: 1, foot: 1, feet: 1, ft: 1, hour: 1, hours: 1, vent: 1, vents: 1, head: 1, heads: 1, ton: 1, tons: 1 };
const DICT_NOTE_FILLER = { and: 1, the: 1, a: 1, an: 1, then: 1, also: 1, please: 1, add: 1, added: 1, replace: 1, replaced: 1, new: 1, put: 1, with: 1, it: 1, its: 1, is: 1, was: 1, to: 1, for: 1, of: 1, on: 1, in: 1, at: 1, more: 1, again: 1, check: 1, checked: 1, needs: 1, needed: 1, fee: 1, look: 1, looked: 1, clean: 1, cleaned: 1 };

/* Match phrases for one catalog item, derived from its label plus any
 * glossary terms the label contains: the full label, the label minus
 * trailing action words ("Capacitor replacement" -> "capacitor"),
 * first+last token ("Diagnostic / service call fee" -> "diagnostic
 * fee"), and contiguous word pairs. A single-word phrase is trusted
 * only when it is a glossary term or the whole stripped label, so
 * fragments like "ac" (from "AC condenser + coil replacement") never
 * become match keys. */
function dictItemPhrases(item) {
  const keys = {};
  const add = (s) => {
    const k = String(s || "").toLowerCase().replace(/[^a-z0-9.$]/g, " ").replace(/\s+/g, " ").trim();
    if (k) keys[k] = true;
  };
  const fullLabel = String(item.label || "");
  const noParen = fullLabel.replace(/\([^)]*\)/g, " ");
  add(noParen);
  const ACTION = { replacement: 1, replace: 1, installation: 1, install: 1, cleaning: 1, clean: 1, recharge: 1, inspection: 1 };
  const toks = noParen.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
  while (toks.length > 1 && ACTION[toks[toks.length - 1]]) toks.pop();
  if (toks.length) add(toks.join(" "));
  if (toks.length >= 3) add(toks[0] + " " + toks[toks.length - 1]);
  for (let i = 0; i + 1 < toks.length; i++) add(toks[i] + " " + toks[i + 1]);
  const labelNorm = " " + dictNorm(fullLabel).replace(/\s+/g, " ") + " ";
  const gloss = {};
  for (const g of (CATALOG.dictationGlossary || [])) {
    const gn = String(g).toLowerCase().replace(/[^a-z0-9.$]/g, " ").replace(/\s+/g, " ").trim();
    if (!gn) continue;
    gloss[gn] = true;
    if (labelNorm.indexOf(" " + gn + " ") >= 0) add(gn);
  }
  const stripped = toks.join(" ");
  const out = [];
  for (const k of Object.keys(keys)) {
    if (k.indexOf(" ") < 0 && !gloss[k] && !(stripped === k && k.length >= 5)) continue;
    out.push(k);
  }
  return out;
}
/* Plural tolerance: "capacitor" also matches "capacitors". */
function dictPhraseVariants(key) {
  const toks = key.split(" ");
  const last = toks[toks.length - 1];
  const vs = {};
  vs[key] = true;
  if (last.length > 1 && last.endsWith("s")) { const t = toks.slice(); t[t.length - 1] = last.slice(0, -1); vs[t.join(" ")] = true; }
  else { const t = toks.slice(); t[t.length - 1] = last + "s"; vs[t.join(" ")] = true; }
  return Object.keys(vs);
}

/* Pure structuring: transcript -> { raw, proposals, notesText }.
 * Proposals are catalog matches (longest phrase wins, catalog order
 * breaks ties) with best-effort spoken quantity ("two capacitors")
 * and price ("at 180", "for $95") read from the words around each
 * match. Everything not consumed by a match becomes notesText, and
 * the raw transcript rides along so nothing is silently dropped.
 * This never touches any job — proposals land only via the review. */
function structureTranscript(transcript) {
  const raw = String(transcript || "").trim();
  if (!raw) return { raw: "", proposals: [], notesText: "" };
  const norm = dictNorm(raw);
  const hay = " " + norm + " ";
  const phraseItem = {};
  const phrases = [];
  for (const cat of (CATALOG.categories || [])) {
    for (const item of (cat.items || [])) {
      for (const key of dictItemPhrases(item)) {
        for (const v of dictPhraseVariants(key)) {
          if (!phraseItem[v]) { phraseItem[v] = item.id; phrases.push(v); }
        }
      }
    }
  }
  phrases.sort((a, b) => b.length - a.length);
  const spans = [];
  const overlaps = (s, e) => spans.some(sp => s < sp.end && e > sp.start);
  for (const ph of phrases) {
    const needle = " " + ph + " ";
    let idx = 0;
    for (;;) {
      const at = hay.indexOf(needle, idx);
      if (at < 0) break;
      const s = at, e = at + ph.length; // hay is raw shifted by its one leading space
      if (!overlaps(s, e)) spans.push({ start: s, end: e, itemId: phraseItem[ph] });
      idx = at + 1;
    }
  }
  spans.sort((a, b) => a.start - b.start);
  const consumed = spans.map(sp => ({ start: sp.start, end: sp.end }));
  const byItem = {};
  const order = [];
  spans.forEach((sp, i) => {
    const prevEnd = i > 0 ? spans[i - 1].end : 0;
    const nextStart = i < spans.length - 1 ? spans[i + 1].start : norm.length;
    let qty = 1;
    const beforeToks = dictTokens(norm.slice(prevEnd, sp.start));
    for (let t = beforeToks.length - 1; t >= 0; t--) {
      const w = beforeToks[t].text;
      if (DICT_QTY_FILLER[w]) continue;
      const n = DICT_NUMBER_WORDS[w] !== undefined ? DICT_NUMBER_WORDS[w] : (/^\d+(\.\d+)?$/.test(w) ? parseFloat(w) : null);
      if (n !== null) {
        qty = n;
        // Consume the number plus the filler/unit words between it and
        // the match ("three pounds of refrigerant") so they don't leak
        // into the notes as fragments.
        for (let j = t; j < beforeToks.length; j++) {
          consumed.push({ start: prevEnd + beforeToks[j].start, end: prevEnd + beforeToks[j].end });
        }
      }
      break;
    }
    let priceCents = null;
    const after = norm.slice(sp.end, Math.min(nextStart, sp.end + 80));
    const pm = after.match(/(?:at|@|for)\s*\$?\s*(\d[\d,]*(?:\.\d{1,2})?)|\$\s*(\d[\d,]*(?:\.\d{1,2})?)|(\d[\d,]*(?:\.\d{1,2})?)\s*(?:dollars|bucks)/);
    if (pm) {
      const v = pm[1] || pm[2] || pm[3];
      priceCents = Math.round(parseFloat(String(v).replace(/,/g, "")) * 100);
      consumed.push({ start: sp.end + pm.index, end: sp.end + pm.index + pm[0].length });
    } else {
      const before = norm.slice(prevEnd, sp.start);
      const bm = before.match(/\$\s*(\d[\d,]*(?:\.\d{1,2})?)/);
      if (bm) {
        priceCents = Math.round(parseFloat(String(bm[1]).replace(/,/g, "")) * 100);
        consumed.push({ start: prevEnd + bm.index, end: prevEnd + bm.index + bm[0].length });
      }
    }
    const item = catalogItemById(sp.itemId);
    const matchedText = raw.slice(sp.start, sp.end);
    if (byItem[sp.itemId]) {
      byItem[sp.itemId].qty += qty;
      if (byItem[sp.itemId].priceCents === null) byItem[sp.itemId].priceCents = priceCents;
      byItem[sp.itemId].matchedText += " + " + matchedText;
    } else {
      byItem[sp.itemId] = { catalogId: sp.itemId, label: item ? item.label : sp.itemId, unit: item ? (item.unit || "flat") : "flat", qty: qty, priceCents: priceCents, matchedText: matchedText };
      order.push(sp.itemId);
    }
  });
  consumed.sort((a, b) => a.start - b.start);
  const merged = [];
  for (const c of consumed) {
    const last = merged[merged.length - 1];
    if (last && c.start <= last.end) last.end = Math.max(last.end, c.end);
    else merged.push({ start: c.start, end: c.end });
  }
  const frags = [];
  let pos = 0;
  for (const c of merged) { if (c.start > pos) frags.push(raw.slice(pos, c.start)); pos = Math.max(pos, c.end); }
  if (pos < raw.length) frags.push(raw.slice(pos));
  const kept = [];
  for (const f of frags) {
    const wordOf = (t) => t.toLowerCase().replace(/[^a-z0-9]/g, "");
    const isFiller = (t) => { const w = wordOf(t); return w === "" || !!DICT_NOTE_FILLER[w]; };
    const toks = f.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
    while (toks.length && isFiller(toks[0])) toks.shift();
    while (toks.length && isFiller(toks[toks.length - 1])) toks.pop();
    if (!toks.length) continue;
    if (toks.every(isFiller)) continue;
    const clean = toks.join(" ").replace(/^[\s,.;:]+/, "").replace(/[\s,.;:]+$/, "").trim();
    if (clean) kept.push(clean);
  }
  let notesText = kept.join("; ");
  if (notesText) notesText = notesText.charAt(0).toUpperCase() + notesText.slice(1);
  return { raw: raw, proposals: order.map(id => byItem[id]), notesText: notesText };
}

function dictationCtor() {
  if (typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition)) {
    return window.SpeechRecognition || window.webkitSpeechRecognition;
  }
  if (typeof globalThis !== "undefined" && (globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition)) {
    return globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
  }
  return null;
}
function dictationErrorText(code) {
  if (code === "not-allowed" || code === "service-not-allowed") return "Microphone permission was denied — allow mic access for this site, or type the notes instead.";
  if (code === "no-speech") return "No speech was heard — try again, closer to the mic.";
  if (code === "audio-capture") return "No microphone was found on this device.";
  if (code === "network") return "The speech service needs a connection — check the signal, or type the notes instead.";
  return "Dictation stopped (" + (code || "unknown error") + ") — type the notes instead if it keeps happening.";
}

const Dictation = {
  glossary: (typeof CATALOG !== "undefined" && CATALOG.dictationGlossary) || [],
  /* Real capability check, evaluated live: true only where the Web
   * Speech API exists (Chrome today; Safari/Firefox fall back to the
   * typed-notes panel). */
  get supported() { return !!dictationCtor(); },
  canDictate(job) { return !!(job && job.consent && job.consent.status === "signed"); },
  lockReason(job) {
    if (!job || !job.consent || job.consent.status === "pending") {
      return "Dictation is locked until the consent is signed — no mic opens before that signature exists.";
    }
    if (job.consent.status === "declined") {
      return "The customer chose written-notes mode for this job — dictation stays off (no recording after a declined consent).";
    }
    return "";
  },
  structureTranscript: structureTranscript,
  /* One recognition session. Handlers: onInterim(text), onFinal(fullText),
   * onError(message), onEnd(). Only transcript text is retained — the
   * recognizer streams results and discards audio itself. */
  createSession(handlers) {
    const Ctor = dictationCtor();
    if (!Ctor) return null;
    handlers = handlers || {};
    const rec = new Ctor();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = "en-US";
    let finalText = "";
    let active = false;
    rec.onresult = function (ev) {
      let interim = "";
      for (let i = ev.resultIndex || 0; i < ev.results.length; i++) {
        const r = ev.results[i];
        const txt = (r && r[0] && r[0].transcript) || "";
        if (r.isFinal) {
          finalText = (finalText + " " + txt).replace(/\s+/g, " ").trim();
          if (handlers.onFinal) handlers.onFinal(finalText);
        } else {
          interim += txt;
        }
      }
      if (handlers.onInterim) handlers.onInterim(interim);
    };
    rec.onerror = function (ev) { if (handlers.onError) handlers.onError(dictationErrorText(ev && ev.error)); };
    rec.onend = function () { active = false; if (handlers.onEnd) handlers.onEnd(); };
    return {
      start() { if (active) return; active = true; try { rec.start(); } catch (e) { active = false; throw e; } },
      stop() { try { rec.stop(); } catch (e) { /* already stopped */ } },
      get active() { return active; },
      get finalText() { return finalText; }
    };
  },
  start(job, handlers) {
    if (!Dictation.canDictate(job)) throw new Error(Dictation.lockReason(job));
    const session = Dictation.createSession(handlers);
    if (!session) throw new Error("Dictation isn't supported in this browser.");
    session.start();
    return session;
  }
};
// Exposed for step 4 and for headless verification of the core flow.
window.Hestrel = {
  CATALOG, loadSettings, saveSettings, loadPrices, savePrices,
  effectivePriceCents, sortedCategories, currentSeason,
  loadJobs, saveJobs, newJob, persistNewJob, findJob,
  addCatalogItem, addCustomItem, removeItem, computeTotals, lineTotalCents,
  consentResolved, signConsent, declineConsent, signApproval,
  convertToInvoice, jobStatusLabel, CONSENT_SENTENCE, Dictation
};

/* ---------------- boot ---------------- */
if (storageFault) onStorageError(storageFault);
renderJobs();
showView("jobs");
</script>
